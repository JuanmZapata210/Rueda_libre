<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna</title>
    <link href="./src/output.css" rel="stylesheet">
</head>

<body class="bg-slate-900 text-white">
    <main class="px-8 py-3 ">
        <p class=" text-indigo-400 mb-4">
            Nuevo · Jueves a sábado
        </p>

        <h1 class="text-5xl font-bold text-white mb-6">Rueda Nocturna</h1>

        <p class="text-slate-300 mb-10">
            Descubre Medellín en bici cuando se encienden las luces
        </p>

        <ul class="mb-10">
            <li class="font-bold text-white mb-2">3 rutas</li>
            <li class="font-bold text-white">Desde $55.000</li>
        </ul>

        <a href="#inscripcion" class="inline-block p-3 rounded bg-indigo-500 text-white font-bold">
            Inscríbete
        </a>
        <div class="mt-16 flex flex-wrap gap-4">
            <button type="button"
                class="p-3 rounded font-bold bg-indigo-500 text-white hover:bg-indigo-400 focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900">
                Principal
            </button>

            <button type="button"
                class="p-3 rounded font-bold bg-slate-700 text-white hover:bg-slate-600 focus:outline-none focus-visible:ring-4 focus-visible:ring-slate-400 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900">
                Secundario
            </button>

            <button type="button"
                class="p-3 rounded font-bold border-2 border-indigo-400 text-indigo-300 hover:bg-indigo-400 hover:text-slate-900 focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900">
                Contorno
            </button>
        </div>
    </main>

</body>

</html>
